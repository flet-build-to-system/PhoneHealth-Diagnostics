name: Android Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_bundle:
        description: 'Build Android App Bundle (.aab) for Google Play'
        required: true
        type: boolean
        default: true
      build_apk:
        description: 'Build Release APK (.apk)'
        required: true
        type: boolean
        default: true

jobs:
  release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Configure Keystore & Environment
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASS_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1. Setup .env from .env.example
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

          # 2. Provision debug.keystore in case debug config is validated
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
            fi
            if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # 3. Configure Release Signing (custom or auto-generated self-signed upload key)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding custom release keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > release-upload-key.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${STORE_PASS_SECRET:-android}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PASS_SECRET:-android}" >> $GITHUB_ENV
          else
            echo "Generating self-signed upload keystore for release..."
            keytool -genkeypair -v -keystore my-upload-key.jks \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Upload,O=AIStudio,C=US"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Build Release APK
        if: ${{ github.event_name == 'push' || inputs.build_apk }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build Android App Bundle (.aab)
        if: ${{ github.event_name == 'push' || inputs.build_bundle }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        if: ${{ github.event_name == 'push' || inputs.build_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: phone-diagnostics-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload App Bundle (.aab)
        if: ${{ github.event_name == 'push' || inputs.build_bundle }}
        uses: actions/upload-artifact@v4
        with:
          name: phone-diagnostics-app-bundle
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
