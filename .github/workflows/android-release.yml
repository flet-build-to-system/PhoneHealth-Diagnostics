name: Android Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_bundle:
        description: 'Build Android App Bundle (.aab) for Google Play'
        required: true
        type: boolean
        default: true
      build_apk:
        description: 'Build Release APK (.apk)'
        required: true
        type: boolean
        default: true

jobs:
  release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Configure Keystore & Environment
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Prepare environment secrets
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

          # Prepare release keystore if provided as GitHub secret
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > release-upload-key.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          elif [ -f debug.keystore.base64 ]; then
            echo "Using fallback debug keystore for signing..."
            base64 -d debug.keystore.base64 > debug.keystore || true
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/debug.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Build Release APK
        if: ${{ github.event_name == 'push' || inputs.build_apk }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Android App Bundle (.aab)
        if: ${{ github.event_name == 'push' || inputs.build_bundle }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload Release APK
        if: ${{ github.event_name == 'push' || inputs.build_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: phone-diagnostics-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload App Bundle (.aab)
        if: ${{ github.event_name == 'push' || inputs.build_bundle }}
        uses: actions/upload-artifact@v4
        with:
          name: phone-diagnostics-app-bundle
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
